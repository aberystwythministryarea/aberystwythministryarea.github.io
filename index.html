            <div id="mapid" style="width: 80%; height: 300px; margin: auto; border: 1px solid #ccc"></div>
			<script>
				var mymap = L.map('mapid').setView([52.407892, -4.0780656], 12);
				L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
					maxZoom: 18,
					attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
					id: 'osm',
					tileSize: 256,
				}).addTo(mymap);
				
				L.marker([52.41406982, -4.08826056]).addTo(mymap).bindPopup("St Mike's Church");
				L.marker([52.3994741, -4.0708185]).addTo(mymap).bindPopup("St. Anne's Church");
				L.marker([52.41464425, -4.07857866]).addTo(mymap).bindPopup("Holy Trinity Church");
				L.marker([52.38717902, -4.08062877]).addTo(mymap).bindPopup("Eglwys Llanychaearn");
